[package]
name = "terminal-security"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
terminal-core = { path = "../terminal-core" }
terminal-storage = { path = "../terminal-storage" }
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["sync", "rt"] }
zeroize = "1.8.2"
thiserror = "2.0.17"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
keyring-core = { version = "=1.0.1", default-features = false }

base64 = "=0.23.1"
zstd = { version = "=0.14.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust", "vendored"] }

