[package]
name = "terminal-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
terminal-core = { path = "../terminal-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4"] }
tokio = { version = "1.48.0", features = ["sync", "rt"] }
async-trait = "0.1.89"
zeroize = "=1.9.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
libsqlite3-sys = { version = "=0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"
