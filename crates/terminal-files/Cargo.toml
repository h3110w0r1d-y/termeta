[package]
name = "terminal-files"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
terminal-core = { path = "../terminal-core" }
serde = { version = "1", features = ["derive"] }
async-trait = "=0.1.92"
tokio = { version = "=1.54.1", features = ["io-util", "fs", "sync", "time", "rt", "macros"] }
