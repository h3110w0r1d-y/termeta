[package]
name = "terminal-ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
terminal-core = { path = "../terminal-core" }
async-trait = "=0.1.89"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "=1.50.0", features = ["net", "time", "sync", "macros", "rt", "io-util"] }
serde_json = "=1.0.154"
