[package]
name = "terminal-ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
terminal-core = { path = "../terminal-core" }
async-trait = "=0.1.92"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "=1.54.1", features = ["net", "time", "sync", "macros", "rt", "io-util"] }
serde_json = "=1.0.154"
