[package]
name = "terminal-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
async-trait = "=0.1.92"
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
zeroize = "=1.9.1"
