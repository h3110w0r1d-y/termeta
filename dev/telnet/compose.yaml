name: termvexa-telnet-test

services:
  telnet:
    build: .
    image: termvexa/telnet-test:local
    container_name: termvexa-telnet-test
    hostname: termvexa-telnet
    ports:
      - "127.0.0.1:2323:23"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "pgrep", "-x", "inetutils-inetd"]
      interval: 10s
      timeout: 2s
      retries: 3
