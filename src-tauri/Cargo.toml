[package]
name = "termvexa"
version = "0.1.0"
description = "Modular desktop SSH client"
edition = "2024"

[lib]
name = "termvexa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.5"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-single-instance = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-core = { path = "../crates/terminal-core" }
terminal-ssh = { path = "../crates/terminal-ssh" }
terminal-storage = { path = "../crates/terminal-storage" }
terminal-security = { path = "../crates/terminal-security" }
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
url = "=2.5.8"
