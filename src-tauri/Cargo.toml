[package]
name = "termeta"
version = "0.1.0"
description = "Modular desktop SSH client"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "Termeta"
path = "src/main.rs"

[lib]
name = "termeta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
terminal-telnet = { path = "../crates/terminal-telnet" }
terminal-local = { path = "../crates/terminal-local" }
terminal-serial = { path = "../crates/terminal-serial" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-core = { path = "../crates/terminal-core" }
terminal-ssh = { path = "../crates/terminal-ssh" }
terminal-files = { path = "../crates/terminal-files" }
terminal-sftp = { path = "../crates/terminal-sftp" }
terminal-storage = { path = "../crates/terminal-storage" }
terminal-security = { path = "../crates/terminal-security" }
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["fs", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1"
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
quick-xml = { version = "=0.42.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSGraphicsContext", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "=0.62.2"
