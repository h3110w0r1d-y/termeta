# 账号秘密只留在 Rust；启动登录可在锁定态进行，业务数据仍须解锁和资源归属校验。

[[permission]]
identifier = "allow-official-account"
description = "允许本地窗口管理官方账号与浏览器第三方登录"
commands.allow = [
  "get_official_sync_status",
  "complete_official_sync",
  "sync_official_vault",
  "get_account_status",
  "refresh_account",
  "list_account_providers",
  "logout_account",
  "start_account_oauth",
  "confirm_account_oauth",
  "poll_account_oauth",
  "cancel_account_oauth",
]
