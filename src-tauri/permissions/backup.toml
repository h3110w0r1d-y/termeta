# 云备份命令按用途授权；锁定态另由后端限制为首次初始化的 main 窗口。

[[permission]]
identifier = "allow-cloud-backup-settings"
description = "允许读取脱敏云备份配置、保存配置与用户触发的备份同步"
commands.allow = [
  "get_backup_config",
  "save_backup_config",
  "test_backup_config",
  "list_cloud_backups",
  "create_cloud_backup",
  "prepare_cloud_restore",
  "apply_cloud_restore",
]

[[permission]]
identifier = "allow-initialize-from-cloud-backup"
description = "允许主窗口在首次初始化时从已验证的云备份创建保险库"
commands.allow = ["initialize_from_cloud_backup"]
