# 第三方备份仅允许已解锁的本地窗口。

[[permission]]
identifier = "allow-cloud-backup-settings"
description = "允许读取脱敏云备份配置、保存配置与用户触发的备份同步"
commands.allow = [
  "get_backup_config",
  "save_backup_config",
  "test_backup_config",
  "list_cloud_backups",
  "create_cloud_backup",
  "prepare_cloud_restore",
  "apply_cloud_restore",
]
